<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOFO AI 提效看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#05060c; --bg2:#090b18;
    --card:rgba(10,13,26,.78); --card-hover:rgba(18,22,44,.9);
    --border:rgba(168,85,247,.20); --border-strong:rgba(34,211,238,.45);
    --text:#eef0ff; --dim:#8f93b8;
    --indigo:#a855f7; --cyan:#22d3ee; --green:#34d399; --yellow:#fbbf24; --red:#fb7185;
    --purple:#c084fc; --orange:#fb923c; --pink:#f472b6;
    --radius:14px;
    --font-num:'Space Grotesk','Inter',-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  }
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1200px 620px at 82% -10%, rgba(99,102,241,.20), transparent 62%),
      radial-gradient(1000px 520px at -12% 32%, rgba(34,211,238,.13), transparent 60%),
      radial-gradient(900px 480px at 55% 110%, rgba(168,85,247,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
    line-height:1.6;min-height:100vh;overflow-x:hidden;
  }
  ::selection{background:rgba(99,102,241,.4)}

  /* ===== 背景装饰 ===== */
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 25%,transparent 78%);
    mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 25%,transparent 78%);
  }
  /* 星点层 */
  .bg-stars{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 8% 18%,rgba(255,255,255,.55),transparent 55%),
      radial-gradient(1.2px 1.2px at 24% 62%,rgba(196,181,253,.5),transparent 55%),
      radial-gradient(1.8px 1.8px at 38% 12%,rgba(255,255,255,.45),transparent 55%),
      radial-gradient(1.2px 1.2px at 52% 44%,rgba(125,211,252,.45),transparent 55%),
      radial-gradient(1.5px 1.5px at 64% 28%,rgba(255,255,255,.5),transparent 55%),
      radial-gradient(1.2px 1.2px at 76% 70%,rgba(240,171,252,.45),transparent 55%),
      radial-gradient(1.7px 1.7px at 88% 16%,rgba(255,255,255,.5),transparent 55%),
      radial-gradient(1.2px 1.2px at 94% 58%,rgba(196,181,253,.4),transparent 55%),
      radial-gradient(1.4px 1.4px at 16% 86%,rgba(255,255,255,.35),transparent 55%),
      radial-gradient(1.3px 1.3px at 44% 92%,rgba(125,211,252,.4),transparent 55%),
      radial-gradient(1.2px 1.2px at 70% 88%,rgba(255,255,255,.35),transparent 55%);
    animation:starTwinkle 5s ease-in-out infinite alternate;
  }
  @keyframes starTwinkle{0%,100%{opacity:.55}50%{opacity:1}}
  /* 极光光带 */
  .bg-aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(60% 38% at 50% 108%,rgba(168,85,247,.16),transparent 70%),
      radial-gradient(46% 30% at 18% -6%,rgba(34,211,238,.12),transparent 70%),
      radial-gradient(44% 30% at 88% 26%,rgba(236,72,153,.10),transparent 70%);
    animation:auroraShift 16s ease-in-out infinite alternate;
  }
  @keyframes auroraShift{
    0%{transform:translate3d(0,0,0) scale(1);filter:hue-rotate(0deg)}
    50%{transform:translate3d(-24px,12px,0) scale(1.04);filter:hue-rotate(14deg)}
    100%{transform:translate3d(20px,-10px,0) scale(1.02);filter:hue-rotate(-8deg)}
  }
  /* 粒子画布 */
  .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;z-index:0;animation:float 18s ease-in-out infinite}
  .orb.o1{width:430px;height:430px;background:rgba(99,102,241,.38);top:-140px;right:-90px}
  .orb.o2{width:360px;height:360px;background:rgba(34,211,238,.22);bottom:-120px;left:-110px;animation-delay:-6s}
  .orb.o3{width:280px;height:280px;background:rgba(168,85,247,.26);top:42%;left:58%;animation-delay:-11s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(42px,-32px) scale(1.07)}66%{transform:translate(-32px,26px) scale(.95)}}

  /* ===== 滚动进度条 ===== */
  #progressBar{position:fixed;top:0;left:0;right:0;height:3px;z-index:1000;
    background:linear-gradient(90deg,#6366f1,#22d3ee,#c084fc);
    transform:scaleX(0);transform-origin:left;box-shadow:0 0 12px rgba(99,102,241,.8)}

  .container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:28px 24px 40px}

  /* ===== 登录 ===== */
  .login-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 500px at 50% -10%,rgba(99,102,241,.22),transparent 60%),var(--bg);overflow:hidden}
  .login-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:auto}
  .login-box{position:relative;z-index:2;width:380px;max-width:92vw;padding:44px 40px;text-align:center;
    background:var(--card);border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(18px);
    box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    transition:box-shadow .4s,transform .4s,border-color .4s}
  .login-box:hover{border-color:rgba(168,85,247,.55);box-shadow:0 0 60px rgba(168,85,247,.28),0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
  .login-box::before{content:'';position:absolute;inset:-1px;border-radius:22px;padding:1px;
    background:linear-gradient(135deg,rgba(99,102,241,.65),transparent 40%,transparent 60%,rgba(34,211,238,.6));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .login-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-num);font-size:30px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#6366f1,#22d3ee);box-shadow:0 10px 30px rgba(99,102,241,.45);
    animation:logoBreathe 3.2s ease-in-out infinite}
  @keyframes logoBreathe{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(99,102,241,.45)}50%{transform:scale(1.06);box-shadow:0 10px 42px rgba(34,211,238,.6)}}
  .login-box h2{font-size:21px;font-weight:700;margin-bottom:6px}
  .login-box .login-sub{color:var(--dim);font-size:13px;margin-bottom:26px}
  .login-field{position:relative;margin-bottom:14px}
  .login-input{width:100%;padding:13px 46px 13px 16px;background:rgba(10,15,28,.7);border:1px solid var(--border);border-radius:12px;
    color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,transform .2s}
  .login-input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
  .login-input.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(251,113,133,.22);animation:inputShake .45s}
  @keyframes inputShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .login-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;cursor:pointer;
    color:var(--dim);padding:5px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    transition:color .2s,background .2s}
  .login-eye:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .login-btn{position:relative;width:100%;padding:13px;border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:600;
    cursor:pointer;overflow:hidden;background:linear-gradient(92deg,#6366f1,#7c5cf0 55%,#22d3ee);background-size:180% 100%;
    box-shadow:0 10px 26px rgba(99,102,241,.4);transition:background-position .4s,transform .15s,box-shadow .3s}
  .login-btn:hover{background-position:100% 0;box-shadow:0 14px 34px rgba(99,102,241,.55)}
  .login-btn:active{transform:scale(.97)}
  .login-btn .btn-text{position:relative;z-index:2}
  .login-btn::after{content:'';position:absolute;top:0;left:-80%;width:55%;height:100%;z-index:1;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.32),transparent);
    animation:btnShine 2.8s ease-in-out infinite}
  @keyframes btnShine{0%{left:-80%}55%,100%{left:130%}}
  .login-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px;transition:opacity .3s}

  /* ===== 顶栏 ===== */
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 30px;flex-wrap:wrap;gap:16px}
  .header-left{display:flex;align-items:center;gap:16px}
  .logo-badge{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-num);font-size:25px;font-weight:700;color:#fff;flex-shrink:0;
    background:linear-gradient(135deg,#6366f1,#22d3ee);box-shadow:0 10px 30px rgba(99,102,241,.4)}
  .header-left h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
  .gradient-text{background:linear-gradient(92deg,#818cf8,#22d3ee 45%,#c084fc 80%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
  @keyframes shimmer{to{background-position:-220% 0}}
  .subtitle{color:var(--dim);font-size:13px;margin-top:3px}
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:8px 16px;font-size:13px;color:var(--dim);backdrop-filter:blur(10px)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .pill strong{color:var(--text);font-variant-numeric:tabular-nums}
  #countdown{min-width:56px;text-align:center;font-family:var(--font-num);font-variant-numeric:tabular-nums}
  .refresh-btn{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:9px 20px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
    backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s;overflow:hidden}
  .refresh-btn:hover{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
  .refresh-btn .ico{display:inline-block;font-size:15px;line-height:1}
  .refresh-btn.spinning .ico{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .link-btn{position:relative;display:flex;align-items:center;gap:8px;border:none;border-radius:999px;
    padding:9px 20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;
    background:linear-gradient(92deg,#2970ff,#00c2ff);background-size:180% 100%;
    box-shadow:0 8px 22px rgba(41,112,255,.35);transition:background-position .35s,box-shadow .35s,transform .2s;overflow:hidden}
  .link-btn:hover{background-position:100% 0;box-shadow:0 10px 28px rgba(0,194,255,.45);transform:translateY(-1px)}
  .link-btn:active{transform:translateY(0) scale(.97)}
  .link-btn .ico{display:inline-block;font-size:14px;line-height:1}
  .link-btn .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg);animation:btnShine 3.2s ease-in-out infinite}
  @keyframes btnShine{0%,55%{left:-60%}85%,100%{left:130%}}

  /* ===== 指标卡 ===== */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}
  .metric-card{position:relative;overflow:hidden;padding:22px 24px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--border);backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .25s ease,border-color .25s,box-shadow .25s}
  .metric-card:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:0 18px 44px rgba(0,0,0,.42)}
  .metric-card::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;
    background:radial-gradient(320px 120px at 80% -20%,rgba(255,255,255,.08),transparent 70%)}
  .metric-card:hover::after{opacity:1}
  .metric-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .metric-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
  .metric-value{font-family:var(--font-num);font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.1;
    font-variant-numeric:tabular-nums}
  .metric-value .unit{font-size:14px;font-weight:500;color:var(--dim);margin-left:6px}
  .metric-label{color:var(--dim);font-size:13px;margin-top:6px}
  .bar-tip{position:absolute;right:18px;top:18px;font-size:11px;color:var(--dim);opacity:0;transition:opacity .25s}
  .metric-card:hover .bar-tip{opacity:1}
  .m-indigo .metric-ico{background:rgba(99,102,241,.18);color:#818cf8}
  .m-indigo .metric-value{color:#a5b4fc}
  .m-green .metric-ico{background:rgba(52,211,153,.15);color:#34d399}
  .m-green .metric-value{color:#6ee7b7}
  .m-cyan .metric-ico{background:rgba(34,211,238,.15);color:#22d3ee}
  .m-cyan .metric-value{color:#67e8f9}
  .m-yellow .metric-ico{background:rgba(251,191,36,.15);color:#fbbf24}
  .m-yellow .metric-value{color:#fcd34d}
  .m-purple .metric-ico{background:rgba(167,139,250,.16);color:#c084fc}
  .m-purple .metric-value{color:#e9d5ff}
  .m-red .metric-ico{background:rgba(248,113,113,.15);color:#f87171}
  .m-red .metric-value{color:#fca5a5}
  .m-indigo{box-shadow:inset 0 2px 0 rgba(99,102,241,.55),0 10px 30px rgba(0,0,0,.28)}
  .m-green{box-shadow:inset 0 2px 0 rgba(52,211,153,.55),0 10px 30px rgba(0,0,0,.28)}
  .m-cyan{box-shadow:inset 0 2px 0 rgba(34,211,238,.55),0 10px 30px rgba(0,0,0,.28)}
  .m-yellow{box-shadow:inset 0 2px 0 rgba(251,191,36,.55),0 10px 30px rgba(0,0,0,.28)}
  .m-purple{box-shadow:inset 0 2px 0 rgba(167,139,250,.55),0 10px 30px rgba(0,0,0,.28)}
  .m-red{box-shadow:inset 0 2px 0 rgba(248,113,113,.55),0 10px 30px rgba(0,0,0,.28)}

  /* ===== 图表 ===== */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}
  .chart-card{padding:22px 24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);
    backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .chart-card.full{grid-column:1/-1}
  .chart-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .chart-title .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
  .chart-wrap{position:relative;height:270px}
  .chart-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:2}
  .chart-center .cc-val{font-family:var(--font-num);font-size:32px;font-weight:700;color:var(--green);text-shadow:0 0 18px rgba(52,211,153,.5)}
  .chart-center .cc-label{font-size:12px;color:var(--dim);margin-top:2px}

  /* ===== 表格 ===== */
  .table-section{border-radius:var(--radius);background:var(--card);border:1px solid var(--border);
    backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28);overflow:hidden}
  .table-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;gap:14px;flex-wrap:wrap;
    border-bottom:1px solid var(--border)}
  .table-header h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
  .count-badge{font-family:var(--font-num);font-size:12px;font-weight:600;color:#a5b4fc;background:rgba(99,102,241,.16);
    border-radius:999px;padding:2px 10px}
  .table-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filter-btn{background:rgba(10,15,28,.6);border:1px solid var(--border);color:var(--dim);border-radius:999px;
    padding:7px 15px;font-size:12.5px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .filter-btn:hover{border-color:var(--indigo);color:var(--text)}
  .filter-btn.active{background:linear-gradient(92deg,rgba(99,102,241,.9),rgba(124,92,240,.9));border-color:transparent;color:#fff;
    box-shadow:0 6px 18px rgba(99,102,241,.35)}
  select.filter-btn{appearance:auto;padding-right:8px}
  .search-input{background:rgba(10,15,28,.6);border:1px solid var(--border);color:var(--text);border-radius:999px;
    padding:7px 16px;font-size:12.5px;width:190px;outline:none;transition:border-color .2s,box-shadow .2s}
  .search-input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
  .table-scroll{overflow:auto;max-height:560px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;z-index:3;background:rgba(15,22,36,.96);backdrop-filter:blur(8px);text-align:left;
    padding:13px 16px;font-weight:600;color:var(--dim);white-space:nowrap;border-bottom:1px solid var(--border);font-size:12px;letter-spacing:.3px}
  tbody tr{border-bottom:1px solid rgba(148,163,184,.08);transition:background .18s}
  tbody tr:hover{background:rgba(99,102,241,.07)}
  tbody td{padding:11px 16px;white-space:nowrap;vertical-align:middle}
  .td-wrap{white-space:normal;word-break:break-word;min-width:190px;max-width:330px;line-height:1.5}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
  .tag-blue{background:rgba(96,165,250,.14);color:#93c5fd}
  .tag-green{background:rgba(52,211,153,.14);color:#6ee7b7}
  .tag-yellow{background:rgba(251,191,36,.13);color:#fcd34d}
  .tag-orange{background:rgba(251,146,60,.13);color:#fdba74}
  .tag-gray{background:rgba(148,163,184,.13);color:#c4b5fd}
  .tag-red{background:rgba(248,113,113,.14);color:#fca5a5}
  .tag-purple{background:rgba(167,139,250,.14);color:#e9d5ff}
  .tag-cyan{background:rgba(34,211,238,.13);color:#67e8f9}
  .progress-bar{display:inline-block;width:64px;height:6px;background:rgba(148,163,184,.18);border-radius:4px;
    vertical-align:middle;margin:0 8px 0 4px;overflow:hidden}
  .progress-fill{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#6366f1,#22d3ee)}
  .link{color:#93c5fd;text-decoration:none;font-size:12px;font-weight:500;border-bottom:1px dashed rgba(147,197,253,.4);
    padding-bottom:1px;transition:color .2s}
  .link:hover{color:#fff;border-bottom-color:#fff}
  .save-high{color:#6ee7b7;font-weight:600}
  .save-mid{color:#fcd34d;font-weight:600}
  .save-low{color:var(--dim)}

  /* ===== 页脚 ===== */
  footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;
    border-top:1px solid var(--border);color:var(--dim);font-size:12.5px;flex-wrap:wrap;gap:10px}
  footer a{color:var(--dim);text-decoration:none;border-bottom:1px dashed rgba(139,150,168,.4)}
  footer a:hover{color:var(--text)}

  /* ===== Toast ===== */
  .toast{position:fixed;bottom:26px;right:26px;z-index:9998;display:flex;align-items:center;gap:9px;
    background:rgba(15,22,36,.94);border:1px solid var(--border);border-radius:13px;padding:13px 20px;font-size:13px;
    box-shadow:0 16px 44px rgba(0,0,0,.5);backdrop-filter:blur(12px);pointer-events:none}
  .toast .t-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

function escapeHtml(s) {

    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function sha256(msg) {
  var buf = new TextEncoder().encode(msg);
  var hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(function(b) {
    return b.toString(16).padStart(2, "0");
  }).join("");
}

// ============================================================
// 粒子背景系统 (全局 + 登录页)
// ============================================================
function createParticleField(canvas, opts) {
  if (!canvas || !canvas.getContext) return null;
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var o = Object.assign({
    count: 60, linkDist: 130, speed: .35, color: "168,85,247",
    color2: "34,211,238", interactive: true, lineOpacity: .32
  }, opts || {});
  var w, h, parts = [], mouse = { x: -9999, y: -9999 }, raf = null, running = true;
  function resize() {
    w = canvas.clientWidth || canvas.parentElement.clientWidth || window.innerWidth;
    h = canvas.clientHeight || canvas.parentElement.clientHeight || window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make() {
    return {
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * o.speed, vy: (Math.random() - .5) * o.speed,
      r: Math.random() * 1.8 + .6,
      c: Math.random() < .75 ? o.color : o.color2
    };
  }
  function step() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < -12) p.x = w + 12; if (p.x > w + 12) p.x = -12;
      if (p.y < -12) p.y = h + 12; if (p.y > h + 12) p.y = -12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + p.c + ",.85)";
      ctx.fill();
    }
    var dist, dx, dy;
    for (var i = 0; i < parts.length; i++) {
      for (var j = i + 1; j < parts.length; j++) {
        var a = parts[i], b = parts[j];
        dx = a.x - b.x; dy = a.y - b.y; dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < o.linkDist) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = "rgba(" + o.color + "," + (o.lineOpacity * (1 - dist / o.linkDist)) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    if (o.interactive) {
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        dx = p.x - mouse.x; dy = p.y - mouse.y; dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 160) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = "rgba(" + o.color2 + "," + (o.lineOpacity * (1 - dist / 160)) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(step);
  }
  function onMove(e) {
    var r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
  }
  function onLeave() { mouse.x = -9999; mouse.y = -9999; }
  resize();
  for (var i = 0; i < o.count; i++) parts.push(make());
  if (o.interactive) {
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseleave", onLeave);
  }
  step();
  window.addEventListener("resize", resize);
  return {
    burst: function() {
      for (var i = 0; i < 26; i++) {
        parts.push({
          x: w / 2 + (Math.random() - .5) * 160, y: h / 2 + (Math.random() - .5) * 120,
          vx: (Math.random() - .5) * 2.2, vy: (Math.random() - .5) * 2.2,
          r: Math.random() * 2 + 1, c: Math.random() < .5 ? o.color2 : "212,163,115"
        });
      }
      if (parts.length > o.count + 60) parts.splice(0, parts.length - o.count - 30);
    },
    stop: function() {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      if (o.interactive) {
        canvas.removeEventListener("mousemove", onMove);
        canvas.removeEventListener("mouseleave", onLeave);
      }
    }
  };
}

// 数据聚合
// ============================================================
function aggregate(records) {
  var groups = {}, statuses = {}, groupEff = {}, groupStatus = {};
  records.forEach(function(r) {
    var g = r.group || "未分组";
    groups[g] = (groups[g] || 0) + 1;
    var s = r.status || "未知";
    statuses[s] = (statuses[s] || 0) + 1;
    groupEff[g] = (groupEff[g] || 0) + (parseFloat(r.efficiency_hours) || 0);
    if (!groupStatus[g]) groupStatus[g] = {};
    groupStatus[g][s] = (groupStatus[g][s] || 0) + 1;
  });
  return { groups: groups, statuses: statuses, groupEff: groupEff, groupStatus: groupStatus };
}

function computeKPIs(records) {
  var total = records.length;
  var online = records.filter(function(r) { return normYes(r.online); }).length;
  var effTotal = records.reduce(function(s, r) { return s + (parseFloat(r.efficiency_hours) || 0); }, 0);
  var origTotal = records.reduce(function(s, r) { return s + (parseFloat(r.orig_hours) || 0); }, 0);
  var aiTotal = records.reduce(function(s, r) { return s + (parseFloat(r.ai_hours) || 0); }, 0);
  var saveRate = origTotal > 0 ? (origTotal - aiTotal) / origTotal * 100 : 0;
  var skillCount = records.filter(function(r) { return r.has_skill === "是"; }).length;
  var blockerCount = records.filter(function(r) { return r.has_blocker === "是"; }).length;
  var groupCount = Object.keys(aggregate(records).groups).length;
  return {
    total: total, online: online, effTotal: effTotal,
    saveRate: saveRate, skillCount: skillCount, blockerCount: blockerCount, groupCount: groupCount
  };
}

function chartOpts() {

    }

}

function barGrad(ctx, color) {
  var h = ctx.canvas.clientHeight || 300, w = ctx.canvas.clientWidth || 600;
  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, color);
  g.addColorStop(1, color + "33");
  return g;
}
function barGradH(ctx, color) {
  var w = ctx.canvas.clientWidth || 600;
  var g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, color + "55");
  g.addColorStop(1, color);
  return g;
}

// ============================================================
// 图表数值标注插件: 柱状图标数值 + 圆环图标数值 (带描边)
// ============================================================
var valueLabelsPlugin = {
  id: "valueLabels",
  afterDatasetsDraw: function(chart) {
    var ctx = chart.ctx;
    ctx.save();
    var fontSm = '700 11px Inter, "PingFang SC", "Microsoft YaHei", sans-serif';
    var fontLg = '800 12px Inter, "PingFang SC", "Microsoft YaHei", sans-serif';
    var type = chart.config.type;

    function label(txt, x, y, inside) {
      // inside=true: 白字深描边(色块上); inside=false: 深字浅描边(浅底上)
      ctx.lineWidth = 2.6;
      if (inside) {
        ctx.fillStyle = "#fff"; ctx.strokeStyle = "rgba(74,58,43,.85)";
      } else {
        ctx.fillStyle = "#4a3a2b"; ctx.strokeStyle = "rgba(250,246,240,.92)";
      }
      ctx.strokeText(txt, x, y);
      ctx.fillText(txt, x, y);
    }

    if (type === "doughnut") {
      var dData = chart.data.datasets[0].data;
      chart.getDatasetMeta(0).data.forEach(function(el, i) {
        var v = dData[i];
        if (!v) return;
        var a = (el.startAngle + el.endAngle) / 2;
        var r = (el.outerRadius + el.innerRadius) / 2;
        ctx.font = fontSm; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        label(String(v), el.x + Math.cos(a) * r, el.y + Math.sin(a) * r, true);
      });
    } else if (type === "bar") {
      var stacked = chart.options.scales && chart.options.scales.y && chart.options.scales.y.stacked;
      var horizontal = chart.options.indexAxis === "y";
      chart.data.datasets.forEach(function(ds, di) {
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function(el, i) {
          var v = ds.data[i];
          if (!v) return;
          ctx.font = fontSm;
          if (horizontal) {
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            var t = (+v).toFixed(1).replace(/\.0$/, "");
            label(t, el.x + 5, el.y, false);
          } else if (stacked) {
            // 段高足够才标在段内
            if (Math.abs(el.base - el.y) >= 13) {
              ctx.textAlign = "center"; ctx.textBaseline = "middle";
              label(String(v), el.x, (el.y + el.base) / 2, true);
            }
          }
        });
      });
      // 堆叠柱顶标合计
      if (stacked && !horizontal) {
        var totals = [];
        chart.data.datasets.forEach(function(ds, di) {
          var meta = chart.getDatasetMeta(di);
          if (meta.hidden) return;
          ds.data.forEach(function(v, i) { totals[i] = (totals[i] || 0) + (v || 0); });
        });
        chart.getDatasetMeta(0).data.forEach(function(el, i) {
          var t = totals[i];
          if (!t) return;
          var topY = Infinity;
          chart.data.datasets.forEach(function(ds, di) {
            var m = chart.getDatasetMeta(di);
            if (m.hidden || !m.data[i]) return;
            topY = Math.min(topY, m.data[i].y);
          });
          ctx.font = fontLg; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          label(String(t), el.x, topY - 4, false);
        });
      }
    }
    ctx.restore();
  }
};

  var html = '<button class="filter-btn active" data-g="all" onclick="setFilter(\'group\',\'all\')">全部</button>';
  Object.keys(groups).forEach(function(g) {
    html += '<button class="filter-btn" data-g="' + escapeHtml(g) + '" onclick="setFilter(\'group\',\'' + escapeHtml(g) + '\')">' +
      escapeHtml(g) + ' <span style="opacity:.65">' + groups[g] + '</span></button>';
  });
  html += '<select class="filter-btn" onchange="setFilter(\'status\',this.value)"><option value="all">状态: 全部</option>' +
    Object.keys(STATUS_CONFIG).filter(function(s) { return s !== "关闭"; }).map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join("") + '</select>';
  html += '<select class="filter-btn" onchange="setFilter(\'blocker\',this.value)">' +
    '<option value="all">卡点: 全部</option><option value="是">有卡点</option><option value="否">无卡点</option></select>';
  html += '<input type="text" class="search-input" placeholder="搜索项目 / 负责人 / 小组..." oninput="setFilter(\'search\',this.value)">';
  document.getElementById("tableControls").innerHTML = html;
}

function setFilter(key, val) {
  filters[key] = key === "search" ? val.toLowerCase() : val;
  renderTable();
}

function filteredRecords() {
  var records = currentData.records || [];
  if (filters.group !== "all") records = records.filter(function(r) { return (r.group || "未分组") === filters.group; });
  if (filters.status !== "all") records = records.filter(function(r) { return r.status === filters.status; });
  if (filters.blocker !== "all") records = records.filter(function(r) { return r.has_blocker === filters.blocker; });
  if (filters.search) {
    records = records.filter(function(r) {
      return (r.title || "").toLowerCase().includes(filters.search) ||
             (r.owner || "").toLowerCase().includes(filters.search) ||
             (r.group || "").toLowerCase().includes(filters.search);
    });
  }
  records.sort(function(a, b) {
    var sa = statusOrder[a.status] !== undefined ? statusOrder[a.status] : 5;
    var sb = statusOrder[b.status] !== undefined ? statusOrder[b.status] : 5;
    if (sa !== sb) return sa - sb;
    return (b.deadline || "").localeCompare(a.deadline || "");
  });
  return records;
}

function renderTable() {
  var list = filteredRecords();
  document.getElementById("tableCount").textContent = list.length + " / " + (currentData.records || []).length;

  document.querySelectorAll("[data-g]").forEach(function(btn) {
    btn.classList.toggle("active", btn.getAttribute("data-g") === filters.group);
  });

  var rows = list.map(function(r) {
    var sc = STATUS_CONFIG[r.status] || { cls: "tag-gray" };
    var pct = Math.max(0, Math.min(100, Math.round((parseFloat(r.progress) || 0) * 100)));
    var bar = '<span class="progress-bar"><span class="progress-fill" style="width:' + pct + '%"></span></span>' +
      '<span style="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums">' + pct + '%</span>';
    var onlineBadge = normYes(r.online) ? '<span title="已上线" style="margin-left:7px;font-size:12px;color:#7d9b76;vertical-align:middle">●</span>' : "";
    var save = 0;
    if (parseFloat(r.orig_hours) > 0) {
      save = Math.round((parseFloat(r.orig_hours) - (parseFloat(r.ai_hours) || 0)) / parseFloat(r.orig_hours) * 100);
    }
    var saveCls = save >= 70 ? "save-high" : (save >= 40 ? "save-mid" : "save-low");
    var blockerTd = r.has_blocker === "是"
      ? '<span class="tag tag-red" title="' + escapeHtml(r.blocker_detail || "卡点详情未填写") + '">有</span>'
      : '<span class="tag tag-gray" style="opacity:.6">无</span>';
    var skillTd = r.has_skill === "是"
      ? '<span class="tag tag-purple">SKILL</span>'
      : '<span style="color:var(--dim);opacity:.55">—</span>';
    var link = r.result_link
      ? '<a class="link" href="' + escapeHtml(r.result_link) + '" target="_blank" rel="noopener">查看 ↗</a>'
      : '<span style="color:var(--dim);opacity:.5">—</span>';

    return '<tr>' +
      '<td class="td-wrap"><span title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title || "—") + '</span>' + onlineBadge + '</td>' +
      '<td><span class="tag" style="color:' + groupColor(r.group || "未分组") + ';background:' + groupColor(r.group || "未分组") + '1f">' + escapeHtml(r.group || "—") + '</span></td>' +
      '<td><span class="tag ' + sc.cls + '">' + escapeHtml(r.status || "—") + '</span> ' + bar + '</td>' +
      '<td>' + escapeHtml(r.owner || "—") + '</td>' +
      '<td style="font-variant-numeric:tabular-nums">' + escapeHtml(r.deadline || "—") + '</td>' +
      '<td style="font-family:var(--font-num);font-weight:600">' + (parseFloat(r.efficiency_hours) ? parseFloat(r.efficiency_hours).toFixed(1) : "—") + '</td>' +
      '<td class="' + saveCls + '">' + (parseFloat(r.orig_hours) > 0 ? save + "%" : "—") + '</td>' +
      '<td>' + blockerTd + '</td>' +
      '<td>' + skillTd + '</td>' +
      '<td>' + link + '</td>' +
    '</tr>';
  }).join("");

  document.getElementById("tableBody").innerHTML = rows;
  // GSAP 行级入场动画
  gsap.fromTo("#tableBody tr",
    { y: 14, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.4, stagger: 0.02, ease: "power2.out", clearProps: "transform" });
}

// ============================================================
// 渲染: 全部
// ============================================================
function renderAll() {
  renderMetrics();
  renderCharts();
  buildControls();
  renderTable();
  document.getElementById("updateTime").textContent = currentData.updated_at || BUILD_TIMESTAMP || "--";
}

// ============================================================
// 数据刷新 (双路径: Worker 实时优先(6s超时) → 降级 data.json)
// ============================================================
function fetchWithTimeout(url, opts, ms) {
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var p = fetch(url, Object.assign({}, opts, ctrl ? { signal: ctrl.signal } : {}));
  if (ctrl) setTimeout(function() { ctrl.abort(); }, ms || 6000);
  return p;
}

function refreshData(silent) {
  var btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  var oldKey = currentData.records ? JSON.stringify(currentData.records) : "";

  function done() { btn.classList.remove("spinning"); }

  function apply(data, source) {
    currentData = sanitizeData(data);
    var changed = JSON.stringify(currentData.records) !== oldKey;
    renderAll();
    done();
    if (!silent) showToast(changed ? "数据已刷新 · " + source : "数据已是最新", changed ? "" : "error");
  }

  if (WORKER_URL) {
    fetchWithTimeout(WORKER_URL + "/api/refresh", { cache: "no-store", mode: "cors" }, 6000)
      .then(function(res) { return res.json().then(function(j) { return { status: res.status, body: j }; }); })
      .then(function(r) {
        if (r.body && r.body.ok && r.body.data && r.body.data.records) {
          apply(r.body.data, "实时接口");
          return;
        }
        throw new Error("HTTP " + r.status);
      })
      .catch(function() { return fetchFromJson(silent, done); });
  } else {
    fetchFromJson(silent, done);
  }
}

function fetchFromJson(silent, done) {
  fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data && data.records) {
        currentData = sanitizeData(data);
        renderAll();
        done();
        if (!silent) showToast("数据已刷新 · 定时同步源");
      } else { throw new Error("数据格式异常"); }
    })
    .catch(function(err) {
      done();
      if (!silent) showToast("刷新失败: " + err.message, "error");
    });
}

// ============================================================
// 倒计时
// ============================================================
function startCountdown() {
  setInterval(function() {
    var remain = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
    var m = Math.floor(remain / 60), s = remain % 60;
    document.getElementById("countdown").textContent =
      (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    if (remain <= 0) {
      nextRefreshAt = Date.now() + REFRESH_INTERVAL;
      refreshData(true);
    }
  }, 1000);
}

// ============================================================
// GSAP 交互动效
// ============================================================
function bindEffects() {
  // 滚动进度条
  gsap.to("#progressBar", {
    scaleX: 1, ease: "none",
    scrollTrigger: { trigger: document.body, start: 0, end: "max", scrub: 0.3 }
  });

  // 磁吸按钮
  function magnetic(el, strength) {
    if (window.matchMedia("(hover:none)").matches) return;
    el.addEventListener("mousemove", function(e) {
      var r = el.getBoundingClientRect();
      var x = e.clientX - (r.left + r.width / 2);
      var y = e.clientY - (r.top + r.height / 2);
      gsap.to(el, { x: x * strength, y: y * strength, duration: 0.3, ease: "power2.out" });
    });
    el.addEventListener("mouseleave", function() {
      gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: "elastic.out(1,0.35)" });
    });
  }
  magnetic(document.getElementById("refreshBtn"), 0.25);
  magnetic(document.getElementById("feishuLink"), 0.25);
  magnetic(document.getElementById("loginBtn"), 0.2);

  // 顶栏入场
  gsap.from(".header", { y: -30, opacity: 0, duration: 0.7, ease: "power3.out" });

  // 图表卡片滚动出现
  document.querySelectorAll("[data-scroll]").forEach(function(el) {
    gsap.fromTo(el, { y: 44, opacity: 0 }, {
      y: 0, opacity: 1, duration: 0.75, ease: "power3.out",
      scrollTrigger: { trigger: el, start: "top 88%" }
    });
  });

  // 刷新按钮
  document.getElementById("refreshBtn").addEventListener("click", function() {
    nextRefreshAt = Date.now() + REFRESH_INTERVAL;
    refreshData(false);
  });
}

// ============================================================
// 初始化
// ============================================================
function initDashboard() {
  if (started) return;
  started = true;
  // 全局背景粒子
  var bg = document.getElementById("bgCanvas");
  if (bg) bg._fx = createParticleField(bg, {
    count: 55, linkDist: 120, speed: .3,
    color: "176,137,104", color2: "141,134,152", interactive: false, lineOpacity: .2
  });
  bindEffects();
  renderAll();
  // 进入即拉取最新 data.json 覆盖陈旧内嵌快照，避免“每次登录数据回到旧版”
  fetchFromJson(true, function() {});
  startCountdown();
  setInterval(function() { refreshData(true); }, REFRESH_INTERVAL);
}
</script>
