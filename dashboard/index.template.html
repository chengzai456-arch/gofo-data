<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOFO AI 项目跟踪看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0d1117;--card:#161b22;--card-hover:#1c2330;--border:#30363d;
      --text:#e6edf3;--text-dim:#8b949e;--accent:#4f8cff;
      --blue:#4f8cff;--orange:#ff8c42;--green:#42d39b;--yellow:#ffd642;--purple:#c44fff;--red:#ff6b6b;
      --radius:12px;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.6;min-height:100vh}
    .container{max-width:1400px;margin:0 auto;padding:24px}

    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
    .header-left h1{font-size:26px;font-weight:700;letter-spacing:-0.5px}
    .header-left .subtitle{color:var(--text-dim);font-size:13px;margin-top:4px}
    .header-right{display:flex;align-items:center;gap:16px}
    .update-badge{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text-dim)}
    .update-badge .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s}
    .metric-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
    .metric-card.blue::before{background:var(--blue)}
    .metric-card.green::before{background:var(--green)}
    .metric-card.orange::before{background:var(--orange)}
    .metric-card.purple::before{background:var(--purple)}
    .metric-icon{font-size:28px;margin-bottom:12px;display:block}
    .metric-value{font-size:36px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
    .metric-value .unit{font-size:16px;font-weight:400;color:var(--text-dim);margin-left:4px}
    .metric-label{color:var(--text-dim);font-size:14px;margin-top:4px}

    .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
    .chart-card.full{grid-column:1/-1}
    .chart-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .chart-title .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .chart-wrap{position:relative;height:260px}

    .table-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .table-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
    .table-header h2{font-size:15px;font-weight:600}
    .table-controls{display:flex;gap:10px;flex-wrap:wrap}
    .filter-btn{background:var(--card-hover);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s}
    .filter-btn:hover{border-color:var(--accent);color:var(--text)}
    .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .search-input{background:var(--card-hover);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 14px;font-size:13px;width:200px;outline:none;transition:border-color .15s}
    .search-input:focus{border-color:var(--accent)}
    .table-scroll{overflow-x:auto;max-height:480px;overflow-y:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead th{position:sticky;top:0;background:var(--card-hover);text-align:left;padding:12px 16px;font-weight:600;color:var(--text-dim);white-space:nowrap;z-index:1}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
    tbody tr:hover{background:var(--card-hover)}
    tbody td{padding:10px 16px;white-space:nowrap}
    .tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:500}
    .tag-blue{background:rgba(79,140,255,.15);color:var(--blue)}
    .tag-orange{background:rgba(255,140,66,.15);color:var(--orange)}
    .tag-green{background:rgba(66,211,155,.15);color:var(--green)}
    .tag-yellow{background:rgba(255,214,66,.15);color:var(--yellow)}
    .tag-purple{background:rgba(196,79,255,.15);color:var(--purple)}
    .tag-red{background:rgba(255,107,107,.15);color:var(--red)}
    .video-link{color:var(--accent);text-decoration:none;font-size:12px}
    .video-link:hover{text-decoration:underline}
    .status-active{color:var(--green);font-weight:600}

    .refresh-btn{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--accent);color:#fff;border:none;border-radius:8px;
      padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;
      transition:background .2s, transform .1s;
    }
    .refresh-btn:hover{background:#3d7aff;transform:translateY(-1px)}
    .refresh-btn:active{transform:translateY(0)}
    .refresh-btn.loading{opacity:.7;pointer-events:none}
    .refresh-icon{display:inline-block;font-size:16px;transition:transform .6s}
    .refresh-btn.loading .refresh-icon{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{
      position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
      padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;
      animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
      pointer-events:none;
    }
    .toast.success{background:#1a3a2a;color:var(--green);border:1px solid var(--green)}
    .toast.error{background:#3a1a1a;color:var(--red);border:1px solid var(--red)}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes toastOut{from{opacity:1}to{opacity:0}}

    .login-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:var(--bg);z-index:10000;
      display:flex;align-items:center;justify-content:center;
    }
    .login-box{
      background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:40px 36px;width:360px;max-width:90vw;text-align:center;
    }
    .login-box h2{font-size:20px;margin-bottom:8px}
    .login-box .login-sub{color:var(--text-dim);font-size:13px;margin-bottom:24px}
    .login-input{
      width:100%;padding:12px 16px;background:var(--card-hover);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:15px;outline:none;
      margin-bottom:16px;transition:border-color .15s;
    }
    .login-input:focus{border-color:var(--accent)}
    .login-btn{
      width:100%;padding:12px;background:var(--accent);color:#fff;
      border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;
      transition:background .15s;
    }
    .login-btn:hover{background:#3d7aff}
    .login-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}

    @media(max-width:900px){
      .metrics{grid-template-columns:repeat(2,1fr)}
      .charts{grid-template-columns:1fr}
    }
    @media(max-width:600px){
      .metrics{grid-template-columns:1fr}
      .container{padding:16px}
      .header-left h1{font-size:20px}
    }
  </style>
</head>
<body>
  <!-- 登录遮罩 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>🔐 GOFO 项目看板</h2>
      <div class="login-sub">请输入访问密码</div>
      <input type="password" class="login-input" id="loginInput" placeholder="输入密码..." autofocus>
      <button class="login-btn" id="loginBtn">进入看板</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>GOFO AI 项目跟踪看板</h1>
        <div class="subtitle">飞书多维表数据驱动</div>
      </div>
      <div class="header-right">
        <div class="update-badge" id="updateBadge">
          <span class="live-dot"></span>
          <span id="updateTime">--:--:--</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="从飞书多维表拉取最新数据">
          <span class="refresh-icon" id="refreshIcon">🔄</span> 刷新数据
        </button>
      </div>
    </div>

    <!-- Metric Cards -->
    <div class="metrics" id="metrics">
      <div class="metric-card blue">
        <span class="metric-icon">📋</span>
        <div class="metric-value" id="m-total">--</div>
        <div class="metric-label">总项目数</div>
      </div>
      <div class="metric-card green">
        <span class="metric-icon">✅</span>
        <div class="metric-value" id="m-active">--</div>
        <div class="metric-label">已生效项目</div>
      </div>
      <div class="metric-card orange">
        <span class="metric-icon">🏢</span>
        <div class="metric-value" id="m-systems">--</div>
        <div class="metric-label">覆盖系统数</div>
      </div>
      <div class="metric-card purple">
        <span class="metric-icon">⏱️</span>
        <div class="metric-value" id="m-duration">--<span class="unit">分钟</span></div>
        <div class="metric-label">视频总时长</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-card">
        <div class="chart-title"><span class="dot" style="background:var(--blue)"></span>各模块项目分布</div>
        <div class="chart-wrap"><canvas id="chartModule"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title"><span class="dot" style="background:var(--orange)"></span>各系统项目分布</div>
        <div class="chart-wrap"><canvas id="chartSystem"></canvas></div>
      </div>
      <div class="chart-card full">
        <div class="chart-title"><span class="dot" style="background:var(--green)"></span>贡献者视频数量</div>
        <div class="chart-wrap"><canvas id="chartContributor"></canvas></div>
      </div>
    </div>

    <!-- Project Table -->
    <div class="table-section">
      <div class="table-header">
        <h2>📁 项目明细</h2>
        <div class="table-controls">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="考勤模块">考勤模块</button>
          <button class="filter-btn" data-filter="绩效模块">绩效模块</button>
          <button class="filter-btn" data-filter="系统权限">系统权限</button>
          <button class="filter-btn" data-filter="编制管理">编制管理</button>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索项目标题...">
        </div>
      </div>
      <div class="table-scroll">
        <table id="dataTable">
          <thead>
            <tr>
              <th>标题</th>
              <th>所属模块</th>
              <th>所属系统</th>
              <th>视频时长</th>
              <th>创建人</th>
              <th>发布日期</th>
              <th>状态</th>
              <th>链接</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 内嵌数据（由 build.js 在构建时注入） -->
  <script>
    var LOGIN_HASH = "__LOGIN_HASH__";
    var BUILD_TIMESTAMP = "__BUILD_TIMESTAMP__";
  </script>

  <script>
    // ============================================================
    // 登录验证
    // ============================================================
    (function checkAuth() {
      // 已登录则跳过
      if (sessionStorage.getItem("gofo_authed") === "1") {
        document.getElementById("loginOverlay").style.display = "none";
        return;
      }

      async function doLogin() {
        var pw = document.getElementById("loginInput").value.trim();
        if (!pw) return;
        var hash = await sha256(pw);
        if (hash === LOGIN_HASH) {
          sessionStorage.setItem("gofo_authed", "1");
          document.getElementById("loginOverlay").style.display = "none";
          document.getElementById("loginError").textContent = "";
        } else {
          document.getElementById("loginError").textContent = "密码错误，请重试";
          document.getElementById("loginInput").value = "";
          document.getElementById("loginInput").focus();
        }
      }

      async function sha256(msg) {
        var buf = new TextEncoder().encode(msg);
        var hash = await crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
      }

      document.getElementById("loginBtn").addEventListener("click", doLogin);
      document.getElementById("loginInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") doLogin();
      });
    })();

    // ============================================================
    // 内嵌数据渲染
    // ============================================================
    var EMBEDDED_DATA = __EMBEDDED_DATA_PLACEHOLDER__;
  </script>

  <script>
    // ============================================================
    // 同域 data.json（由 build.js 生成，与看板一同部署，不受网络封锁影响）
    // ============================================================
    var API_URL = "./data.json";
    // ============================================================
    // 颜色映射 & 图表配置
    // ============================================================
    const MODULE_COLORS = { "考勤模块":"#4f8cff", "绩效模块":"#ff8c42", "系统权限":"#42d39b", "编制管理":"#ffd642" };
    const MODULE_TAG_CLASS = { "考勤模块":"tag-blue", "绩效模块":"tag-orange", "系统权限":"tag-green", "编制管理":"tag-yellow" };
    const SYSTEM_COLORS = { "考勤机":"#4f8cff", "OEHR":"#ff8c42", "OTWS":"#42d39b", "OA":"#ffd642", "HRMS":"#c44fff", "薪酬":"#ff6b6b" };
    const SYSTEM_TAG_CLASS = { "考勤机":"tag-blue", "OEHR":"tag-orange", "OTWS":"tag-green", "OA":"tag-yellow", "HRMS":"tag-purple", "薪酬":"tag-red" };
    const CONTRIBUTOR_COLORS = ["#4f8cff","#ff8c42","#42d39b","#ffd642","#c44fff","#ff6b6b","#64b4ff","#40e0d0"];

    let charts = {};
    let currentFilter = "all";
    let searchQuery = "";
    var currentData = EMBEDDED_DATA;  // 当前数据（刷新后可更新）

    // ============================================================
    // 数据聚合
    // ============================================================
    function aggregate(records) {
      const modules = {};
      const systems = {};
      const contributors = {};
      let activeCount = 0;
      let totalDuration = 0;
      records.forEach((r) => {
        if (r.module) modules[r.module] = (modules[r.module] || 0) + 1;
        if (r.system) systems[r.system] = (systems[r.system] || 0) + 1;
        if (r.creator) contributors[r.creator] = (contributors[r.creator] || 0) + 1;
        if (r.active === "是") activeCount++;
        totalDuration += r.duration_seconds || 0;
      });
      return { modules, systems, contributors, activeCount, totalDuration,
        totalRecords: records.length, systemCount: Object.keys(systems).length };
    }

    // ============================================================
    // 渲染
    // ============================================================
    function renderMetrics(agg) {
      document.getElementById("m-total").textContent = agg.totalRecords;
      document.getElementById("m-active").textContent = agg.activeCount;
      document.getElementById("m-systems").textContent = agg.systemCount;
      document.getElementById("m-duration").innerHTML = `${(agg.totalDuration / 60).toFixed(1)}<span class="unit">分钟</span>`;
    }

    function renderCharts(agg) {
      const cd = {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: "right", labels: { color: "#8b949e", font: { size: 12 }, padding: 12, usePointStyle: true, pointStyle: "circle" } },
          tooltip: { backgroundColor: "#161b22", titleColor: "#e6edf3", bodyColor: "#e6edf3", borderColor: "#30363d", borderWidth: 1, padding: 12, cornerRadius: 8 },
        },
      };

      // 模块柱状图
      const mKeys = Object.keys(agg.modules);
      if (charts.module) charts.module.destroy();
      charts.module = new Chart(document.getElementById("chartModule"), {
        type: "bar",
        data: { labels: mKeys, datasets: [{ data: mKeys.map(k => agg.modules[k]), backgroundColor: mKeys.map(k => MODULE_COLORS[k] || "#8b949e"), borderRadius: 8, barThickness: 40 }] },
        options: { ...cd, plugins: { ...cd.plugins, legend: { display: false } },
          scales: { x: { ticks: { color: "#8b949e", font: { size: 12 } }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: "#8b949e", stepSize: 1, font: { size: 12 } }, grid: { color: "#21262d" } } } },
      });

      // 系统环形图
      const sKeys = Object.keys(agg.systems);
      if (charts.system) charts.system.destroy();
      charts.system = new Chart(document.getElementById("chartSystem"), {
        type: "doughnut",
        data: { labels: sKeys, datasets: [{ data: sKeys.map(k => agg.systems[k]), backgroundColor: sKeys.map(k => SYSTEM_COLORS[k] || "#8b949e"), borderColor: "#161b22", borderWidth: 3 }] },
        options: { ...cd, cutout: "60%" },
      });

      // 贡献者横向柱状图
      const cKeys = Object.keys(agg.contributors);
      if (charts.contributor) charts.contributor.destroy();
      charts.contributor = new Chart(document.getElementById("chartContributor"), {
        type: "bar",
        data: { labels: cKeys, datasets: [{ data: cKeys.map(k => agg.contributors[k]), backgroundColor: cKeys.map((_, i) => CONTRIBUTOR_COLORS[i % CONTRIBUTOR_COLORS.length]), borderRadius: 8, barThickness: 28 }] },
        options: { ...cd, indexAxis: "y", plugins: { ...cd.plugins, legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { color: "#8b949e", stepSize: 1, font: { size: 12 } }, grid: { color: "#21262d" } }, y: { ticks: { color: "#8b949e", font: { size: 13 } }, grid: { display: false } } } },
      });
    }

    function renderTable(records) {
      const tbody = document.getElementById("tableBody");
      let filtered = records;
      if (currentFilter !== "all") filtered = filtered.filter(r => r.module === currentFilter);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(r => r.title.toLowerCase().includes(q) || (r.creator||"").toLowerCase().includes(q) || (r.system||"").toLowerCase().includes(q));
      }
      filtered.sort((a, b) => (b.publish_date || "").localeCompare(a.publish_date || ""));

      tbody.innerHTML = filtered.length ? filtered.map(r => `<tr>
        <td>${r.title||"—"}</td>
        <td><span class="tag ${MODULE_TAG_CLASS[r.module]||"tag-blue"}">${r.module||"—"}</span></td>
        <td><span class="tag ${SYSTEM_TAG_CLASS[r.system]||"tag-blue"}">${r.system||"—"}</span></td>
        <td>${r.duration||"—"}</td>
        <td>${r.creator||"—"}</td>
        <td>${r.publish_date||"—"}</td>
        <td><span class="status-active">${r.active === "是" ? "生效" : "—"}</span></td>
        <td>${r.video_url ? `<a href="${r.video_url}" target="_blank" class="video-link">▶ 观看</a>` : "—"}</td>
      </tr>`).join("") : `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-dim)">没有匹配的项目</td></tr>`;
    }

    function updateTimestamp(iso) {
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, "0");
      document.getElementById("updateTime").textContent =
        `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    // ============================================================
    // 事件绑定
    // ============================================================
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderTable(currentData.records);
      });
    });
    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      renderTable(currentData.records);
    });

    // ============================================================
    // 刷新 — 从 Worker API 拉取最新数据
    // ============================================================
    function showToast(msg, type) {
      var t = document.createElement("div");
      t.className = "toast " + type;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 3000);
    }

    function refreshData(silent) {
      var btn = document.getElementById("refreshBtn");
      var icon = document.getElementById("refreshIcon");
      if (!silent) { btn.classList.add("loading"); icon.textContent = "⏳"; }

      // 加时间戳参数避免浏览器缓存旧版 data.json
      fetch(API_URL + "?t=" + Date.now())
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(data) {
          // data.json 格式: {total, updated_at, records}
          if (!data || !data.records) throw new Error("数据格式异常");

          currentData = data;
          renderAll();
          if (!silent) showToast("✓ 数据已刷新（" + data.total + " 条记录）", "success");
        })
        .catch(function(err) {
          if (!silent) showToast("✗ 刷新失败：" + err.message + "（数据保持为上次部署版本）", "error");
        })
        .finally(function() {
          if (!silent) { btn.classList.remove("loading"); icon.textContent = "🔄"; }
        });
    }

    function renderAll() {
      var agg = aggregate(currentData.records);
      renderMetrics(agg);
      renderCharts(agg);
      renderTable(currentData.records);
      updateTimestamp(currentData.updated_at || BUILD_TIMESTAMP);
    }

    // ============================================================
    // 启动
    // ============================================================
    (function init() {
      renderAll();
      document.getElementById("refreshBtn").addEventListener("click", function() { refreshData(false); });
      // 每5分钟自动静默刷新（外网环境生效，内网静默失败）
      setInterval(function() { refreshData(true); }, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
