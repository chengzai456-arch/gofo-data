<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOFO AI 项目跟踪看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0d1117;--card:#161b22;--card-hover:#1c2330;--border:#30363d;
      --text:#e6edf3;--text-dim:#8b949e;--accent:#4f8cff;
      --blue:#4f8cff;--orange:#ff8c42;--green:#42d39b;--yellow:#ffd642;--purple:#c44fff;--red:#ff6b6b;--cyan:#00d4ff;
      --radius:12px;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.6;min-height:100vh}
    .container{max-width:1400px;margin:0 auto;padding:24px}

    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
    .header-left h1{font-size:26px;font-weight:700;letter-spacing:-0.5px}
    .header-left .subtitle{color:var(--text-dim);font-size:13px;margin-top:4px}
    .header-right{display:flex;align-items:center;gap:16px}
    .update-badge{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text-dim)}
    .update-badge .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
    .metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s}
    .metric-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
    .metric-card.blue::before{background:var(--blue)}
    .metric-card.green::before{background:var(--green)}
    .metric-card.orange::before{background:var(--orange)}
    .metric-card.purple::before{background:var(--purple)}
    .metric-card.yellow::before{background:var(--yellow)}
    .metric-card.cyan::before{background:var(--cyan)}
    .metric-icon{font-size:28px;margin-bottom:12px;display:block}
    .metric-value{font-size:36px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
    .metric-value .unit{font-size:16px;font-weight:400;color:var(--text-dim);margin-left:4px}
    .metric-label{color:var(--text-dim);font-size:14px;margin-top:4px}

    .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
    .chart-card.full{grid-column:1/-1}
    .chart-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .chart-title .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .chart-wrap{position:relative;height:260px}
    .chart-wrap.tall{height:320px}

    .table-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .table-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
    .table-header h2{font-size:15px;font-weight:600}
    .table-controls{display:flex;gap:10px;flex-wrap:wrap}
    .filter-btn{background:var(--card-hover);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s}
    .filter-btn:hover{border-color:var(--accent);color:var(--text)}
    .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .filter-select{background:var(--card-hover);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;outline:none;transition:border-color .15s;appearance:none;padding-right:24px;background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%238b949e' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 4px center;background-size:16px}
    .filter-select:hover,.filter-select:focus{border-color:var(--accent);color:var(--text)}
    .search-input{background:var(--card-hover);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 14px;font-size:13px;width:200px;outline:none;transition:border-color .15s}
    .search-input:focus{border-color:var(--accent)}
    .table-scroll{overflow-x:auto;max-height:520px;overflow-y:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead th{position:sticky;top:0;background:var(--card-hover);text-align:left;padding:12px 16px;font-weight:600;color:var(--text-dim);white-space:nowrap;z-index:1}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
    tbody tr:hover{background:var(--card-hover)}
    tbody td{padding:10px 16px;white-space:nowrap}
    .tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:500}
    .tag-blue{background:rgba(79,140,255,.15);color:var(--blue)}
    .tag-orange{background:rgba(255,140,66,.15);color:var(--orange)}
    .tag-green{background:rgba(66,211,155,.15);color:var(--green)}
    .tag-yellow{background:rgba(255,214,66,.15);color:var(--yellow)}
    .tag-purple{background:rgba(196,79,255,.15);color:var(--purple)}
    .tag-red{background:rgba(255,107,107,.15);color:var(--red)}
    .tag-gray{background:rgba(139,148,158,.15);color:var(--text-dim)}
    .link{color:var(--accent);text-decoration:none;font-size:12px}
    .link:hover{text-decoration:underline}
    .progress-bar{display:inline-block;width:60px;height:6px;background:var(--border);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
    .progress-fill{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
    .progress-pct{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;vertical-align:middle}

    .refresh-btn{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--accent);color:#fff;border:none;border-radius:8px;
      padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;
      transition:background .2s, transform .1s;
    }
    .refresh-btn:hover{background:#3d7aff;transform:translateY(-1px)}
    .refresh-btn:active{transform:translateY(0)}
    .refresh-btn.loading{opacity:.7;pointer-events:none}
    .refresh-icon{display:inline-block;font-size:16px;transition:transform .6s}
    .refresh-btn.loading .refresh-icon{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{
      position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
      padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;
      animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
      pointer-events:none;
    }
    .toast.success{background:#1a3a2a;color:var(--green);border:1px solid var(--green)}
    .toast.error{background:#3a1a1a;color:var(--red);border:1px solid var(--red)}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes toastOut{from{opacity:1}to{opacity:0}}

    .login-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:var(--bg);z-index:10000;
      display:flex;align-items:center;justify-content:center;
    }
    .login-box{
      background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:40px 36px;width:360px;max-width:90vw;text-align:center;
    }
    .login-box h2{font-size:20px;margin-bottom:8px}
    .login-box .login-sub{color:var(--text-dim);font-size:13px;margin-bottom:24px}
    .login-input{
      width:100%;padding:12px 16px;background:var(--card-hover);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:15px;outline:none;
      margin-bottom:16px;transition:border-color .15s;
    }
    .login-input:focus{border-color:var(--accent)}
    .login-btn{
      width:100%;padding:12px;background:var(--accent);color:#fff;
      border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;
      transition:background .15s;
    }
    .login-btn:hover{background:#3d7aff}
    .login-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}

    @media(max-width:900px){
      .metrics{grid-template-columns:repeat(2,1fr)}
      .charts{grid-template-columns:1fr}
    }
    @media(max-width:600px){
      .metrics{grid-template-columns:1fr}
      .container{padding:16px}
      .header-left h1{font-size:20px}
    }
  </style>
</head>
<body>
  <!-- 登录遮罩 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>GOFO AI 项目看板</h2>
      <div class="login-sub">请输入访问密码</div>
      <input type="password" class="login-input" id="loginInput" placeholder="输入密码..." autofocus>
      <button class="login-btn" id="loginBtn">进入看板</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>GOFO AI 项目跟踪看板</h1>
        <div class="subtitle">飞书多维表数据驱动  |  自动每5分钟同步</div>
      </div>
      <div class="header-right">
        <div class="update-badge" id="updateBadge">
          <span class="live-dot"></span>
          <span id="updateTime">--:--:--</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="从飞书多维表拉取最新数据">
          <span class="refresh-icon" id="refreshIcon">🔄</span> 刷新数据
        </button>
      </div>
    </div>

    <!-- Metric Cards -->
    <div class="metrics" id="metrics">
      <div class="metric-card blue">
        <span class="metric-icon">📋</span>
        <div class="metric-value" id="m-total">--</div>
        <div class="metric-label">AI 项目总数</div>
      </div>
      <div class="metric-card green">
        <span class="metric-icon">🚀</span>
        <div class="metric-value" id="m-online">--</div>
        <div class="metric-label">已上线项目</div>
      </div>
      <div class="metric-card orange">
        <span class="metric-icon">👥</span>
        <div class="metric-value" id="m-groups">--</div>
        <div class="metric-label">覆盖小组数</div>
      </div>
      <div class="metric-card purple">
        <span class="metric-icon">⚡</span>
        <div class="metric-value" id="m-efficiency">--<span class="unit">H/月</span></div>
        <div class="metric-label">累计提效时间</div>
      </div>
      <div class="metric-card yellow">
        <span class="metric-icon">⏱️</span>
        <div class="metric-value" id="m-saved">--<span class="unit">H/月</span></div>
        <div class="metric-label">AI 节省工时</div>
      </div>
      <div class="metric-card cyan">
        <span class="metric-icon">📈</span>
        <div class="metric-value" id="m-ratio">--</div>
        <div class="metric-label">AI 提效率</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-card">
        <div class="chart-title"><span class="dot" style="background:var(--blue)"></span>各小组项目分布</div>
        <div class="chart-wrap"><canvas id="chartGroup"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title"><span class="dot" style="background:var(--orange)"></span>项目状态分布</div>
        <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
      </div>
      <div class="chart-card full">
        <div class="chart-title"><span class="dot" style="background:var(--green)"></span>各小组提效时间对比（H/月）</div>
        <div class="chart-wrap tall"><canvas id="chartEfficiency"></canvas></div>
      </div>
    </div>

    <!-- Project Table -->
    <div class="table-section">
      <div class="table-header">
        <h2>项目明细</h2>
        <div class="table-controls">
          <select class="filter-select" id="blockerFilter">
            <option value="all">卡点：全部</option>
            <option value="是">有卡点</option>
            <option value="否">无卡点</option>
          </select>
          <select class="filter-select" id="statusFilter">
            <option value="all">进度：全部</option>
            <option value="进行中">进行中</option>
            <option value="待启动">待启动</option>
            <option value="已完成">已完成</option>
            <option value="暂停">暂停</option>
            <option value="关闭">关闭</option>
          </select>
          <button class="filter-btn active" data-filter="all">全部</button>
          <div id="groupFilters"></div>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索项目名称/负责人...">
        </div>
      </div>
      <div class="table-scroll">
        <table id="dataTable">
          <thead>
            <tr>
              <th>AI 项目名称</th>
              <th>所属小组</th>
              <th>当前进度</th>
              <th>负责人</th>
              <th>预计完成</th>
              <th>提效(H/月)</th>
              <th>AI 节省(H/月)</th>
              <th>卡点</th>
              <th>卡点问题</th>
              <th>可复用SKILL</th>
              <th>成果</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 内嵌数据（由 fetch-and-build.js 在构建时注入） -->
  <script>
    var LOGIN_HASH = "__LOGIN_HASH__";
    var BUILD_TIMESTAMP = "__BUILD_TIMESTAMP__";
  </script>

  <script>
    // ============================================================
    // 登录验证
    // ============================================================
    (function checkAuth() {
      if (sessionStorage.getItem("gofo_authed") === "1") {
        document.getElementById("loginOverlay").style.display = "none";
        return;
      }

      async function doLogin() {
        var pw = document.getElementById("loginInput").value.trim();
        if (!pw) return;
        var hash = await sha256(pw);
        if (hash === LOGIN_HASH) {
          sessionStorage.setItem("gofo_authed", "1");
          document.getElementById("loginOverlay").style.display = "none";
          document.getElementById("loginError").textContent = "";
        } else {
          document.getElementById("loginError").textContent = "密码错误，请重试";
          document.getElementById("loginInput").value = "";
          document.getElementById("loginInput").focus();
        }
      }

      async function sha256(msg) {
        var buf = new TextEncoder().encode(msg);
        var hash = await crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
      }

      document.getElementById("loginBtn").addEventListener("click", doLogin);
      document.getElementById("loginInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") doLogin();
      });
    })();

    // ============================================================
    // 内嵌数据
    // ============================================================
    var EMBEDDED_DATA = __EMBEDDED_DATA_PLACEHOLDER__;
  </script>

  <script>
    var API_URL = "./data.json";
    var WORKER_URL = "https://gofo-dashboard-api.chengzai456.workers.dev";

    // ============================================================
    // 颜色 & 状态配置
    // ============================================================
    var GROUP_COLORS = ["#4f8cff","#ff8c42","#42d39b","#ffd642","#c44fff","#ff6b6b","#64b4ff","#40e0d0"];
    var STATUS_CONFIG = {
      "已完成": { color: "#42d39b", cls: "tag-green" },
      "进行中": { color: "#4f8cff", cls: "tag-blue" },
      "待启动": { color: "#8b949e", cls: "tag-gray" },
      "关闭":   { color: "#ff6b6b", cls: "tag-red" },
      "暂停":   { color: "#ffd642", cls: "tag-yellow" },
    };

    var charts = {};
    var currentFilter = "all";
    var searchQuery = "";
    var blockerFilter = "all";
    var statusFilter = "all";
    var currentData = EMBEDDED_DATA;

    // ============================================================
    // 数据聚合
    // ============================================================
    function aggregate(records) {
      var groups = {};
      var statuses = {};
      var groupEfficiency = {};
      var onlineCount = 0;
      var totalEfficiency = 0;
      var totalOrigHours = 0;
      var totalAiHours = 0;
      var owners = {};

      records.forEach(function(r) {
        var g = r.group || "未分组";
        groups[g] = (groups[g] || 0) + 1;
        var s = r.status || "待启动";
        statuses[s] = (statuses[s] || 0) + 1;
        if (!groupEfficiency[g]) groupEfficiency[g] = 0;
        groupEfficiency[g] += r.efficiency_hours || 0;
        if (r.online === "true") onlineCount++;
        totalEfficiency += r.efficiency_hours || 0;
        totalOrigHours += r.orig_hours || 0;
        totalAiHours += r.ai_hours || 0;
        if (r.owner) {
          // 负责人可能是 @张三@李四 格式
          r.owner.replace(/@/g, " ").trim().split(/\s+/).forEach(function(n) {
            if (n) owners[n] = (owners[n] || 0) + 1;
          });
        }
      });

      return {
        groups: groups,
        statuses: statuses,
        groupEfficiency: groupEfficiency,
        onlineCount: onlineCount,
        totalEfficiency: totalEfficiency,
        totalOrigHours: totalOrigHours,
        totalAiHours: totalAiHours,
        aiSavedHours: totalOrigHours - totalAiHours,
        aiRatio: totalOrigHours > 0 ? (totalOrigHours - totalAiHours) / totalOrigHours : 0,
        totalRecords: records.length,
        groupCount: Object.keys(groups).length,
        owners: owners
      };
    }

    // ============================================================
    // 渲染
    // ============================================================
    function renderMetrics(agg) {
      document.getElementById("m-total").textContent = agg.totalRecords;
      document.getElementById("m-online").textContent = agg.onlineCount;
      document.getElementById("m-groups").textContent = agg.groupCount;
      document.getElementById("m-efficiency").innerHTML = agg.totalEfficiency.toFixed(1) + '<span class="unit">H/月</span>';
      document.getElementById("m-saved").innerHTML = agg.aiSavedHours.toFixed(1) + '<span class="unit">H/月</span>';
      document.getElementById("m-ratio").textContent = Math.round(agg.aiRatio * 100) + "%";
    }

    function renderCharts(agg) {
      var cd = {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: "right", labels: { color: "#8b949e", font: { size: 12 }, padding: 12, usePointStyle: true, pointStyle: "circle" } },
          tooltip: { backgroundColor: "#161b22", titleColor: "#e6edf3", bodyColor: "#e6edf3", borderColor: "#30363d", borderWidth: 1, padding: 12, cornerRadius: 8 },
        },
      };

      // 小组柱状图
      var gKeys = Object.keys(agg.groups);
      if (charts.group) charts.group.destroy();
      charts.group = new Chart(document.getElementById("chartGroup"), {
        type: "bar",
        data: {
          labels: gKeys,
          datasets: [{
            data: gKeys.map(function(k) { return agg.groups[k]; }),
            backgroundColor: gKeys.map(function(_, i) { return GROUP_COLORS[i % GROUP_COLORS.length]; }),
            borderRadius: 8, barThickness: 44
          }]
        },
        options: Object.assign({}, cd, {
          plugins: Object.assign({}, cd.plugins, { legend: { display: false } }),
          scales: {
            x: { ticks: { color: "#8b949e", font: { size: 12 } }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: "#8b949e", stepSize: 1, font: { size: 12 } }, grid: { color: "#21262d" } }
          }
        })
      });

      // 状态环形图
      var sKeys = Object.keys(agg.statuses);
      if (charts.status) charts.status.destroy();
      charts.status = new Chart(document.getElementById("chartStatus"), {
        type: "doughnut",
        data: {
          labels: sKeys,
          datasets: [{
            data: sKeys.map(function(k) { return agg.statuses[k]; }),
            backgroundColor: sKeys.map(function(k) { return (STATUS_CONFIG[k] || {}).color || "#8b949e"; }),
            borderColor: "#161b22", borderWidth: 3
          }]
        },
        options: Object.assign({}, cd, { cutout: "60%" })
      });

      // 各小组提效时间横向柱状图
      var eKeys = Object.keys(agg.groupEfficiency).sort(function(a, b) { return agg.groupEfficiency[b] - agg.groupEfficiency[a]; });
      if (charts.efficiency) charts.efficiency.destroy();
      charts.efficiency = new Chart(document.getElementById("chartEfficiency"), {
        type: "bar",
        data: {
          labels: eKeys,
          datasets: [{
            label: "提效时间 (H/月)",
            data: eKeys.map(function(k) { return agg.groupEfficiency[k]; }),
            backgroundColor: eKeys.map(function(_, i) { return GROUP_COLORS[i % GROUP_COLORS.length]; }),
            borderRadius: 8, barThickness: 28
          }]
        },
        options: Object.assign({}, cd, {
          indexAxis: "y",
          plugins: Object.assign({}, cd.plugins, { legend: { display: false } }),
          scales: {
            x: { beginAtZero: true, ticks: { color: "#8b949e", font: { size: 12 }, callback: function(v) { return v + " H"; } }, grid: { color: "#21262d" } },
            y: { ticks: { color: "#8b949e", font: { size: 13 } }, grid: { display: false } }
          }
        })
      });
    }

    function renderTable(records) {
      var tbody = document.getElementById("tableBody");
      var filtered = records;
      if (currentFilter !== "all") filtered = filtered.filter(function(r) { return r.group === currentFilter; });
      if (blockerFilter !== "all") filtered = filtered.filter(function(r) { return r.has_blocker === blockerFilter; });
      if (statusFilter !== "all") filtered = filtered.filter(function(r) { return r.status === statusFilter; });
      if (searchQuery) {
        var q = searchQuery.toLowerCase();
        filtered = filtered.filter(function(r) {
          return r.title.toLowerCase().includes(q) ||
                 (r.owner || "").toLowerCase().includes(q) ||
                 (r.group || "").toLowerCase().includes(q) ||
                 (r.status || "").toLowerCase().includes(q) ||
                 (r.blocker_detail || "").toLowerCase().includes(q);
        });
      }
      // 按状态优先级 + 预计完成时间排序
      var statusOrder = { "进行中": 0, "待启动": 1, "已完成": 2, "暂停": 3, "关闭": 4 };
      filtered.sort(function(a, b) {
        var sa = statusOrder[a.status] !== undefined ? statusOrder[a.status] : 5;
        var sb = statusOrder[b.status] !== undefined ? statusOrder[b.status] : 5;
        if (sa !== sb) return sa - sb;
        return (b.deadline || "").localeCompare(a.deadline || "");
      });

      tbody.innerHTML = filtered.length ? filtered.map(function(r) {
        var sc = STATUS_CONFIG[r.status] || { cls: "tag-gray", color: "#8b949e" };
        var pct = Math.max(0, Math.min(100, Math.round((r.progress || 0) * 100)));
        var progressBar = '<span class="progress-bar" title="进度 ' + pct + '%"><span class="progress-fill" style="width:' + pct + '%"></span></span><span class="progress-pct">' + pct + '%</span>';
        var savedHours = r.orig_hours ? (r.orig_hours - r.ai_hours) : null;
        return '<tr>' +
          '<td title="' + (r.title || "") + '">' + (r.title || "—") + '</td>' +
          '<td><span class="tag tag-blue">' + (r.group || "—") + '</span></td>' +
          '<td><span class="tag ' + sc.cls + '">' + (r.status || "—") + '</span> ' + progressBar + '</td>' +
          '<td>' + (r.owner || "—") + '</td>' +
          '<td>' + formatDeadline(r.deadline) + '</td>' +
          '<td>' + (r.efficiency_hours ? r.efficiency_hours + " H" : "—") + '</td>' +
          '<td title="原工时 ' + (r.orig_hours || 0) + ' H → AI 工时 ' + (r.ai_hours || 0) + ' H">' + (savedHours !== null ? savedHours.toFixed(1) + " H" : "—") + '</td>' +
          '<td>' + (r.has_blocker === "是" ? '<span style="color:var(--red)">有</span>' : '<span style="color:var(--text-dim)">无</span>') + '</td>' +
          '<td title="' + (r.blocker_detail || "").replace(/"/g,"&quot;") + '">' + formatBlockerDetail(r.blocker_detail) + '</td>' +
          '<td>' + (r.has_skill === "是" ? '<span style="color:var(--green)">有</span>' : '<span style="color:var(--text-dim)">无</span>') + '</td>' +
          '<td>' + (r.result_link ? '<a href="' + r.result_link + '" target="_blank" class="link">查看</a>' : "—") + '</td>' +
        '</tr>';
      }).join("") : '<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--text-dim)">没有匹配的项目</td></tr>';
    }

    function formatDeadline(v) {
      if (!v) return "—";
      // 飞书返回毫秒时间戳或 "2026-06-19 00:00:00" 格式
      var n = Number(v);
      if (!isNaN(n) && n > 100000000000) {
        var d = new Date(n);
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      if (typeof v === "string" && v.includes(" ")) return v.split(" ")[0];
      if (typeof v === "string" && v.length >= 10) return v.substring(0, 10);
      return String(v);
    }

    function formatBlockerDetail(v) {
      if (!v) return "—";
      // 截断显示，完整内容在 title 悬浮提示
      return v.length > 24 ? v.substring(0, 24) + "…" : v;
    }

    function updateTimestamp(iso) {
      var d = new Date(iso);
      var pad = function(n) { return String(n).padStart(2, "0"); };
      document.getElementById("updateTime").textContent =
        d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }

    // ============================================================
    // 动态生成小组筛选按钮
    // ============================================================
    function buildGroupFilters(records) {
      var groups = {};
      records.forEach(function(r) { if (r.group) groups[r.group] = true; });
      var container = document.getElementById("groupFilters");
      container.innerHTML = "";
      Object.keys(groups).sort().forEach(function(g) {
        var btn = document.createElement("button");
        btn.className = "filter-btn";
        btn.dataset.filter = g;
        btn.textContent = g;
        container.appendChild(btn);
      });
      // 重新绑定事件
      document.querySelectorAll(".filter-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          renderTable(currentData.records);
        });
      });
    }

    // ============================================================
    // 搜索
    // ============================================================
    document.getElementById("searchInput").addEventListener("input", function(e) {
      searchQuery = e.target.value.trim();
      renderTable(currentData.records);
    });

    // 卡点筛选
    document.getElementById("blockerFilter").addEventListener("change", function(e) {
      blockerFilter = e.target.value;
      renderTable(currentData.records);
    });

    // 进度筛选
    document.getElementById("statusFilter").addEventListener("change", function(e) {
      statusFilter = e.target.value;
      renderTable(currentData.records);
    });

    // ============================================================
    // 刷新
    // ============================================================
    function showToast(msg, type) {
      var t = document.createElement("div");
      t.className = "toast " + type;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 3000);
    }

    function refreshData(silent) {
      var btn = document.getElementById("refreshBtn");
      var icon = document.getElementById("refreshIcon");
      var startTime = Date.now();
      if (!silent) { btn.classList.add("loading"); icon.textContent = "⏳"; }

      // 直连 Cloudflare Worker → Worker 直连飞书 API，2-5 秒返回
      fetch(WORKER_URL + "/api/refresh")
        .then(function(res) { return res.json(); })
        .then(function(result) {
          var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          if (result.ok && result.data) {
            currentData = result.data;
            renderAll();
            if (!silent) {
              showToast(
                "实时数据刷新完成：" + result.data.total + " 条记录（耗时 " + elapsed + "s）",
                "success"
              );
            }
          } else {
            throw new Error(result.error || "未知错误");
          }
        })
        .catch(function(err) {
          if (!silent) {
            // Worker 不可用时，降级到 data.json
            showToast("实时刷新失败：" + err.message + "，尝试从静态文件加载...", "error");
            fetch(API_URL + "?t=" + Date.now())
              .then(function(res) { return res.json(); })
              .then(function(data) {
                currentData = data;
                renderAll();
                showToast("已从静态文件加载（" + data.total + " 条记录）", "success");
              })
              .catch(function() {
                showToast("加载失败，请稍后重试", "error");
              });
          }
        })
        .finally(function() {
          if (!silent) { btn.classList.remove("loading"); icon.textContent = "🔄"; }
        });
    }

    function renderAll() {
      var agg = aggregate(currentData.records);
      renderMetrics(agg);
      renderCharts(agg);
      renderTable(currentData.records);
      updateTimestamp(currentData.updated_at || BUILD_TIMESTAMP);
    }

    // ============================================================
    // 启动
    // ============================================================
    (function init() {
      buildGroupFilters(currentData.records);
      renderAll();
      document.getElementById("refreshBtn").addEventListener("click", function() { refreshData(false); });
      setInterval(function() { refreshData(true); }, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
