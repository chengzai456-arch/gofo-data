# GOFO 看板自动同步 + 部署
# 每 5 分钟从飞书多维表拉取数据，生成静态页面并部署到 GitHub Pages
#
# 凭证一律从 GitHub Secrets 读取（不再硬编码）:
# 仓库 Settings → Secrets and variables → Actions 添加:
#   FEISHU_APP_ID        飞书应用 App ID
#   FEISHU_APP_SECRET    飞书应用 App Secret（建议先在飞书开放平台重置，旧值已泄露）
#   DASHBOARD_PASSWORD   看板访问密码
# 未配置 FEISHU_APP_ID / FEISHU_APP_SECRET 时跳过同步构建，避免 workflow 报红

name: Sync & Deploy Dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "dashboard"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.sync.outputs.count }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check required secrets
        id: check
        run: |
          if [ -z "${{ secrets.FEISHU_APP_ID }}" ] || [ -z "${{ secrets.FEISHU_APP_SECRET }}" ]; then
            echo "::warning::FEISHU_APP_ID / FEISHU_APP_SECRET 未配置为 GitHub Secrets，本次跳过数据同步。"
            echo "SKIP=1" >> $GITHUB_ENV
          else
            echo "Secrets OK"
          fi
      - name: Fetch & Build
        id: sync
        if: env.SKIP != '1'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node dashboard/fetch-and-build.js
      - name: Commit changes
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "sync: ${{ steps.sync.outputs.count }} 条记录"
            git push
          fi

  deploy:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - uses: actions/deploy-pages@v4
        id: deploy
