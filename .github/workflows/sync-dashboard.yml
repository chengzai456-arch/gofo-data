# GOFO 看板自动同步 + 部署
# 每 5 分钟从飞书多维表拉取数据，生成静态页面并部署到 GitHub Pages

name: Sync & Deploy Dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "dashboard"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.sync.outputs.count }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Decode secrets
        run: |
          echo "FEISHU_APP_ID=$(echo 'Y2xpX2FhOGM2N2MxOGFiYjVjZDU=' | base64 -d)" >> $GITHUB_ENV
          echo "FEISHU_APP_SECRET=$(echo 'WnZ1NHFBbzE3Y2U3elg3bFZaUTZJZmZXVjVpa2xYd2c=' | base64 -d)" >> $GITHUB_ENV
          echo "DASHBOARD_PASSWORD=$(echo 'Z29mbzIwMjU=' | base64 -d)" >> $GITHUB_ENV
      - name: Fetch & Build
        id: sync
        run: node dashboard/fetch-and-build.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "sync: ${{ steps.sync.outputs.count }} 条记录"
            git push
          fi

  deploy:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - uses: actions/deploy-pages@v4
        id: deploy
